name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage

  # Publishes each package whose version on master is not yet on npm, the library first since
  # the MCP server depends on it.
  # Auth via npm Trusted Publishing (OIDC), no NPM_TOKEN secret needed.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Publish new versions
        run: |
          for dir in $(node -p 'require("./package.json").workspaces.join(" ")'); do
            PKG="$(node -p "const p = require('./$dir/package.json'); \`\${p.name}@\${p.version}\`")"
            if npm view "$PKG" version >/dev/null 2>&1; then
              echo "$PKG already published, skipping"
            else
              npm publish -w "$dir"
            fi
          done
